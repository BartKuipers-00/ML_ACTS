# ============================================================================
# Out-of-Distribution Experiment — Master Configuration
# All eval scripts read from this file via --ood-config
# ============================================================================



# ============================================================================
# RUN
# ============================================================================
# 1. Simulate, clean, and convert to PyG (CPU jobs):
#      ./submit_sweep.sh sim
#
# 2. Build latent graphs + GNN inference (GPU jobs):
#      ./submit_sweep.sh eval
#
# 3. Track building + evaluation only — after GNN inference is done
#    (reads use_segment_gnn, track_building, segment_gnn from this file):
#      ./submit_sweep.sh seg
#
# ============================================================================

# Number of events per dataset (all go to testset)
n_events: 200
# Sweep range: particles_per_vertex runs from 10 to max_particles_per_vertex in steps of 10
# (one HTCondor job per step, submitted via submit_sweep.sh)
max_particles_per_vertex: 200   #

# ============================================================================
# LATENT GRAPH CONSTRUCTION
# ============================================================================
latent_graph_construction:
  checkpoint: low_pt_latentmodel_100_mixed_f1=0.2752.ckpt
  k_max: 250
  r_max: 0.18
  r_max_geometric: 600
  segmented: true
  one_in_one_out: true
  dr_same_layer_cut: 10.0
  device: cpu

# ============================================================================
# GNN INFERENCE
# ============================================================================
gnn_inference:
  checkpoint: /data/alice/bkuipers/low_pt_gnn_pipeline/saved_models/Low_pt_gnn_300_MIXED_1i1o_best_val_loss=0.0007.ckpt
  accelerator: cuda
  node_features: [hit_r, hit_phi, hit_z]
  node_scales: [1000, 3.14, 500]

# ============================================================================
# TRACK BUILDING — choose matcher
# ============================================================================

# Set true to use the mini-GNN segment embedder for matching;
# false uses the classical helix fit (Kasa circle + pitch).
use_segment_gnn: false

# ── Helix fit matcher (used when use_segment_gnn: false) ─────────────────────
track_building:
  score_cut: 0.4
  use_gt_segments: true 
  use_wrangler: true
  B_field: 2.0


  matching:
    outer_r_threshold: 1000.0
    max_center_distance: 60.0
    min_R_ratio: 0.65
    sigma_center: 40.0
    sigma_R: 0.05
    sigma_pitch: 0.12
    weight_center: 0.45
    weight_R: 0.08
    weight_pitch: 0.47

# ── Mini-GNN segment embedder (used when use_segment_gnn: true) ──────────────
segment_gnn:
  model_path: data_100_mixed/track_building/mini_GNN_checkpoints/mini_gnn_segment_embedder_val_loss=1.2621.pt
  cos_sim_threshold: 0.65
  outer_r_threshold: 1000.0
  geo_cut_enabled: true
  geo_cut_r_high_mm: 150.0
  geo_cut_r_tol_mm: 15.0
  geo_cut_min_3d_mm: 100.0

# ============================================================================
# EVALUATION (shared by both matchers)
# ============================================================================
evaluation:
  matching_fraction: 0.7
  matching_style: two_way
  min_track_length: 5
  target_tracks:
    pt: [0.1, .inf]
    nhits: [7, .inf]
  target_segments:
    pt: [0.1, .inf]
    min_segment_hits: 2
  variable_with_prefix: true
