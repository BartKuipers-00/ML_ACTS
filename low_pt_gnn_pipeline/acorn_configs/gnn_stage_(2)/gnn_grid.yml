# GNN Hyperparameter Grid Search Configuration (InteractionGNN2)
#
# Usage:    python generate_grid_search.py
#

# Grid search parameters (lists = grid, single values = fixed)
grid_params:
  # Architecture (acorn IGNN2 defaults as starting point)
  hidden: [128]  # acorn default 128 (IGNN1 runs used 256)
  n_graph_iters: [8]
  n_node_net_layers: [3]
  n_edge_net_layers: [3]

  # Training
  lr: [0.001]  # Learning rate (acorn default: 0.0005)
  warmup: [1]
  patience: [0]           # for lr decay

  # Aggregation: "sum" = scatter_add, anything else falls back to scatter_mean
  aggr: [sum]

  # Activations (acorn IGNN2 defaults: ReLU/ReLU)
  hidden_activation: [ReLU]
  output_activation: [ReLU]

# Fixed parameters (applied to all runs)
fixed_params:
  # Data
  input_dir: data/graph_constructed_latent_tsmear_25ps
  stage_dir: data/gnn_stage/
  data_split: [10000, 500, 1000]

  # W&B
  project: GNN_gridsearch_400_pions
  use_wandb: true
  wandb_entity: bart_kuipers-nikhef
  wandb_log_every_n_batches: 50

  # Hardware
  accelerator: cuda
  devices: 1
  nodes: 1
  precision: "16-mixed"

  # Model (InteractionGNN2, acorn defaults)
  model: InteractionGNN2
  edge_cut: 0.5
  undirected: true

  node_features: [hit_r, hit_phi, hit_z, hit_t_smeared, hit_has_time]
  node_scales: [1000, 3.14159265359, 500, 4000, 1]

  # node_features: [hit_r, hit_phi, hit_z]      # 3D features (without time)
  # node_scales: [1000, 3.14159265359, 500]     # Scales for [r, phi, z]

  n_node_encoder_layers: 3
  n_edge_encoder_layers: 3
  n_node_decoder_layers: 3
  n_edge_decoder_layers: 3
  layernorm: true
  output_layer_norm: false
  edge_output_transform_final_layer_norm: false
  batchnorm: false       # IGNN2 default: layernorm only
  output_batch_norm: false
  edge_output_transform_final_batch_norm: false
  bn_track_running_stats: false
  edge_output_transform_final_activation: null
  concat: true
  node_net_recurrent: false
  edge_net_recurrent: false
  in_out_diff_agg: true
  checkpointing: true

  # Training
  num_workers: [8, 8, 0]
  max_epochs: 15
  scheduler: ReduceLROnPlateau
  factor: 0.8
  early_stopping_patience: 6

  #log_every_n_steps: 1
  check_val_every_n_epoch: 1

  val_check_interval: 0.5            #note 1 does batch =1 , 1.0 does epoch = 1, 0.2 does 20% of an epoch
  accumulate_grad_batches: 1

  pos_weight: 1
  logger: false
