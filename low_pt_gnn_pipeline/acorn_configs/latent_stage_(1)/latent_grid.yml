# Latent Space (Metric Learning) Hyperparameter Grid Search Configuration
#
# Usage:
#   1. cd /data/alice/bkuipers/low_pt_gnn_pipeline/latent_stage_(1)
#   2. python generate_grid_search.py

#
#
# Each combination will be run as a separate GPU batch job

# Grid search parameters (lists = grid, single values = fixed)
grid_params:
  # Model architecture
  emb_hidden: [64]        # Hidden layer size
  nb_layer: [5]               # Number of layers
  emb_dim: [8]               # Final latent space dimension
  activation: [Tanh]    # Activation function

  # Training parameters
  lr: [0.001, 0.0001]           # Learning rate
  
  # Paired parameters - must have same length, values at same index are used together
  margin:   [0.1]     # Contrastive loss margin
  r_train:  [0.1]     # Hard negative mining radius (always same as margin)

  # Sampling parameters
  points_per_batch: [5000]
  randomisation: [1]                 # Random negative pairs multiplier
  knn: [100]                          # Max neighbors during training
  knn_val: [100]                      # Max neighbors during validation

  # Scheduler
  patience: [2]
  factor: [0.5]

# Zipped parameters - these are zipped together instead of taking Cartesian product
zipped_params: ['margin', 'r_train']

# Fixed parameters (applied to all runs)
fixed_params:
  # Pipeline stage
  stage: graph_construction
  model: MetricLearning

  # Data directories
  input_dir: data/feature_store/
  stage_dir: data/metric_learning/
  data_split: [1000, 50, 100]

  # W&B
  project: Latent_map_300_mixed_geant_grids_small_2
  use_wandb: true
  wandb_entity: bart_kuipers-nikhef
  wandb_log_every_n_batches: 10

  # Hardware
  accelerator: cpu
  devices: 1
  nodes: 1
  logger: false

  # Model features
  undirected: true
  train_undirected: true
  node_features: [hit_r, hit_phi, hit_z]

  segmented: true
  node_scales: [1000, 3.14, 1210]

  # Edge weighting
  weighting:
    - weight: 0.1
      conditions:
        edge_y: False
    - weight: 1.0
      conditions:
        edge_y: True
        track_particle_primary: True
    - weight: 0.0
      conditions:
        edge_y: True
        track_particle_primary: False

  # Training optimization
  warmup: 1
  scheduler: ReduceLROnPlateau
  max_epochs: 100
  early_stopping_patience: 5
  check_val_every_n_epoch: 1
  val_check_interval: 0.1   # every 100 train events (val=50, ~50% overhead); model peaks within first epoch, so resolve the early region


  # Monitoring
  metric_to_monitor: f1
  metric_mode: max
  num_workers: [3, 3, 0]

  # GPU optimizations
  precision: 16-mixed

  # Checkpointing
  checkpoint_filename: "latentmodel_f1_{f1:.4f}"
  save_top_k: 2
  save_last: false
