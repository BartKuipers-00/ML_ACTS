# ============================================================================
# ACTS DATA READER CONFIGURATION
# ============================================================================
# Converts ACTS CSV files to PyG graph format for metric learning training
# This creates feature_store with graphs containing (r,phi,z) and particle_id
# ============================================================================

stage: data_reading
model: ActsReader

# Input/Output
input_dir: data/csv/                        # ACTS CSV files
stage_dir: data/feature_store/              # Output PyG graphs

# Data split [train, val, test]
data_split: [10, 0, 0]
# Which datasets to process
input_sets: [trainset, valset, testset]
# ACTS-specific settings
simhit_stem: hits                           # Use 'hits' for truth hits
use_truth_hits: false                       # Use smeared measurement positions
detector_path: data/csv/detectors.csv       # Detector geometry

# Features to extract
feature_sets:
  hit_features:
    - hit_id
    - hit_x
    - hit_y  
    - hit_z
    - hit_r
    - hit_phi
    - hit_eta
    - hit_particle_id
    - hit_region
    - hit_volume_id  # Detector volume — for geometry-exact same-layer cut
    - hit_layer_id   # Detector layer — same-layer ⟺ same (volume, layer)
    - hit_t  # Time - needed for trajectory ordering of looping particles
    - hit_segment_id  # Segment label (1,2,3,...) for radial arcs; 0 for noise
  track_features:
    - track_particle_id
    - track_particle_type  # PDG code (13=muon, 211=pion, 11=electron)
    - track_particle_pt
    - track_particle_radius
    - track_particle_nhits
    - track_particle_eta
    - track_particle_primary  # 1=primary, 0=secondary (ACTS isSecondary() convention)

# Region labels — one map per detector geometry. The convert entry points select one via
# `--detector {generic, odd}` (see resolve_region_labels); the chosen map is assigned to
# `region_labels` at runtime and consumed by add_region_labels().
region_labels_by_detector:
  # GenericDetector (FATRAS) volume numbering
  generic:
    1: {volume_id: [7, 9]}    # Pixel endcap
    2: {volume_id: 8}         # Pixel barrel
    3: {volume_id: [12, 14]}  # ShortStrip endcap
    4: {volume_id: 13}        # ShortStrip barrel
    5: {volume_id: [16, 18]}  # LongStrip endcap
    6: {volume_id: 17}        # LongStrip barrel
  # OpenDataDetector (ODD / Geant4) volume numbering
  odd:
    1: {volume_id: [16, 18]}  # Pixel endcap
    2: {volume_id: 17}        # Pixel barrel
    3: {volume_id: [23, 25]}  # ShortStrip endcap
    4: {volume_id: 24}        # ShortStrip barrel
    5: {volume_id: [28, 30]}  # LongStrip endcap
    6: {volume_id: 29}        # LongStrip barrel

# Processing
max_workers: 16                             # 1 = disable multiprocessing (NumPy 2.x compatibility issue)
skip_csv_conversion: false                  # CSV already created, skip to PyG conversion
skip_pyg_conversion: false                  # We want to create PyG
variable_with_prefix: true                  # Keep hit_ prefix

# Logging
log_level: INFO
