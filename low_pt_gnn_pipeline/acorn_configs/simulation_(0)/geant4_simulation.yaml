# ============================================================================
# GEANT4 SIMULATION CONFIGURATION
# ============================================================================
# ============================================================================

num_events: 1
particles_per_vertex: 200  # Per species, per vertex
multiplicity: 1            # Collision vertices per event
random_seed: 42

# ============================================================================
# PARTICLE GUN (multi-species, same as event_generator_simulation.yaml)
# ============================================================================
particle_gun:
  # List one or more species: muon, pion, electron, proton, kaon, photon
  particle_types: ["muon", "pion", "electron"]
  # particle_types: ["muon", "pion", "electron", "proton"]

  randomize_charge: true

  momentum:
    min: 0.1
    max: 0.5
    transverse: true  

  eta:
    min: -3
    max:  3
    uniform: true

  phi:
    min: 0.0
    max: 360.0

# ============================================================================
# DETECTOR & FIELD
# ============================================================================
detector:
  type: "OpenDataDetector"   
  # material_map: "/path/to/odd-material-maps.root" 

magnetic_field:
  strength: 2.0  

# ============================================================================
# SIMULATION
# ============================================================================
simulation:
  log_level: "INFO"
  kill_after_time_ns: 10000.0

# ============================================================================
# DIGITIZATION
# ============================================================================
digitization:
  # Path relative to acts_new/
  config_file: "Examples/Configs/odd-digi-smearing-config.json"

# ============================================================================
# OUTPUT
# ============================================================================
output:
  base_dir: "./data_geant"    # Relative to pipeline root; csv/ subdirectory created
  write_geometry: true       # Write detectors.csv for downstream ACORN reader
