# Mini-GNN Segment Data Mining — GROUND TRUTH Configuration
# Used by mini_gnn_data_mining.py  (pass --config <this file>)
#
# Mines per-segment PyG graphs using PERFECT ground-truth segments
# (each unique (hit_particle_id, hit_segment_id) pair), instead of segments
# produced by CC clustering on GNN edge scores. Use this while the GNN is
# still training and data/gnn_stage/ does not exist yet — it gives an upper
# bound on how well the mini-GNN segment matcher can work.

# Number of events to mine from each split: [trainset, valset, testset]
data_split: [5000, 500, 500]

# Input directory: ground-truth segments only need node features
# (hit_segment_id, hit_particle_id, hit_x/y/z/r) — feature_store has them,
# no edges / GNN scores required.
input_dir: data/feature_store

# Output directory for mined segment data
precomputed_dir: data/track_building/mini_gnn_segments

# ============================================================================
# SEGMENT EXTRACTION
# ============================================================================

use_ground_truth: true   # extract_segments_from_ground_truth (perfect segments)
score_cut: 0.4           # ignored when use_ground_truth is true (read for completeness)
use_wrangler: false      # ignored when use_ground_truth is true (read for completeness)

# ============================================================================
# NODE FEATURES
# ============================================================================

# Normalization scales for hit features: [x, y, z, r]
node_scales: [1000.0, 1000.0, 1200.0, 1000.0]
