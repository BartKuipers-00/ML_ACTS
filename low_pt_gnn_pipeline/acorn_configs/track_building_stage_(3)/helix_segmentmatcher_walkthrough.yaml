# Segment Matching Track Builder Configuration
# Used by helix_segmentmatcher_walkthrough.py
# Matches segments from the same particle via helix parameter comparison

# Dataset parameters
data_split: [0, 10, 1000]

# Input/output
data_set_path: data_300_mixed       # base dir; input_dir/stage_dir/track_evaluation/visuals live under it
input_dir: gnn_stage
stage_dir: track_building
output_dir: helix            # suffix appended to output dirs, e.g. "helix_GT" → testset_helix_GT
# pre_build_tracks_dir: track_building/testset_helix   # only with --skip-build: read prebuilt tracks from here (relative to data_set_path), independent of output_dir naming


# ============================================================================
# SEGMENT EXTRACTION
# ============================================================================

use_gt_segments: false    # true = use hit_segment_id, false = use CC clusters
use_wrangler: true       # true = CC + Wrangler walk-through before helix fitting
score_cut: 0.4           # Edge score threshold for CC clustering

# ============================================================================
# HELIX FITTING
# ============================================================================

B_field: 2.0             # Magnetic field strength (Tesla)
outlier_rejection: false  # Iterative outlier rejection in circle fit

# ============================================================================
# SEGMENT MATCHING
# ============================================================================

matching:
  # Complete track detection — segments reaching outer detector are not matched
  outer_r_threshold: 1000.0   # mm — segments with outer_r >= this are complete tracks

  # Hard cuts (reject pairs violating these)
  max_center_distance: 60.0   # mm — tuned via tune_segment_matching.py
  min_R_ratio: 0.65           # tuned

  # Soft score Gaussian widths
  sigma_center: 40.0          # mm — tuned
  sigma_R: 0.05               # tuned
  sigma_pitch: 0.12           # tuned

  # Score weights  (sum = 1)
  weight_center: 0.45         # tuned
  weight_R: 0.08              # tuned
  weight_pitch: 0.47          # tuned (auto-coupled: 1 - weight_center - weight_R)

# ============================================================================
# EVALUATION PARAMETERS
# ============================================================================

matching_fraction: 0.7
matching_style: two_way
min_track_length: 7

target_tracks:
    pt: [0.1, .inf]
    nhits: [7, .inf]        #reconstructable

target_segments:
    pt: [0.1, .inf]
    min_segment_hits: 2       # each individual segment must have at least this many hits

# Plot configuration
plots:
  segment_evaluation:
    min_bin_fraction: 0.001   # suppress bins with < this fraction of the peak-bin count
  tracking_efficiency:
    title: Track Reconstruction Efficiency (Helix Matching)
    font_sizes:
      axis_label: 18
      tick_label: 14
      legend: 14
      title: 18
    variables:
      pt:
        x_label: '$p_T$ [GeV]'
        x_lim: [0.1, 0.5]
        y_lim: [0.0, 1.05]
        n_bins: 30
      eta:
        x_label: '$\eta$'
        x_lim: [-0.2, 0.2]
        y_lim: [0, 1.1]
        n_bins: 30

# Variable prefix handling
variable_with_prefix: true
