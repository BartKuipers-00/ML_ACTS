# Mini-GNN Segment Embedder — Hyperparameter Grid Search Configuration
#
# Usage:
#   1. Edit grid_params below
#   2. cd /data/alice/bkuipers/low_pt_gnn_pipeline/track_building_stage_(3)
#      python generate_mini_gnn_grid_search.py

# Grid search parameters (lists = grid, single values = fixed)
grid_params:
  # Architecture — settle n_layers for the winning capacity (hidden=256, emb=32)
  hidden_dim: [256]
  n_layers: [5, 4, 3]

  # Architecture
  emb_dim: [32]
  dropout: [0]
  proj_layers: [2]

  # Loss
  temperature: [0.1]

  # Training
  lr: [0.001]
  val_cos_sim_threshold: [0.65]

# Fixed parameters (applied to all runs)
fixed_params:
  # HTCondor job resources
  job_type: cpu        # "cpu" or "gpu"
  job_category: medium  # "express", "short", "medium", "long"

  # 
  data_split: [5000, 100, 0]
  input_dir: data/gnn_stage
  precomputed_dir: data/track_building/mini_gnn_segments

  # Training
  batch_events: 16
  max_epochs: 150
  patience: 10
  scheduler_patience: 4
  scheduler_factor: 0.5
  val_check_interval: 0.2

  # 
  node_scales: [1000, 1000, 1200, 1000]

  # Output
  model_save_dir: data/track_building/mini_GNN_checkpoints
